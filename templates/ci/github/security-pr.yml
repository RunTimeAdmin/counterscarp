name: CounterScarp PR Security

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "**/*.sol"
      - "**/*.rs"
      - "**/*.py"
      - "scarpshield.toml"
      - "counterscarp.toml"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    # Replace org/repo with your canonical CounterScarp repository.
    uses: org/repo/.github/workflows/security-reusable.yml@v1
    with:
      target_path: ./contracts
      config_path: scarpshield.toml
      fail_on_severity: HIGH
      enable_solana: true
      python_version: "3.11"
      upload_sarif: true
    secrets: inherit
