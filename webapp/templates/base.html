<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Counterscarp Engine{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="logo-link">
                <img src="/static/logo.png" alt="Counterscarp Engine" class="logo">
                <span class="brand-name">Counterscarp Engine</span>
            </a>
            <nav>
                <a href="/">Home</a>
                <a href="/pricing">Pricing</a>
                <a href="/settings">Settings</a>
                <a href="https://github.com/RunTimeAdmin/counterscarp/tree/main/docs" target="_blank">Docs</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Counterscarp Engine &bull; <a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a> | <a href="mailto:contact@counterscarp.io">contact@counterscarp.io</a></p>
    </footer>
</body>
</html>
