# old_implementation_path = "contracts/old/Implementation.sol"
# new_implementation_path = "contracts/Implementation.sol"

# --- Scenario 3: Audit-Ready Strict Mode ---
# [engine]
# fail_on_severity = "MEDIUM"  # Fail on any medium+ issues
#
# [heuristics]
# # Enable all rules, no suppressions
# [heuristics.disabled_rules]
# # (empty - all rules active)
#
# [reporting]
# verbosity = "verbose"
# [reporting.sections]
# fuzzing = true
# threat_intel = true
