# ============================================================================
# Counterscarp Engine Configuration
# Per-project security analysis settings
# ============================================================================

[engine]
# Engine-wide settings
name = "Counterscarp Security Engine"
version = "5.0.0"

# Minimum severity to fail CI/CD (CRITICAL, HIGH, MEDIUM, LOW, INFO)
fail_on_severity = "HIGH"

# Maximum findings before stopping scan (0 = unlimited)
max_findings = 0


# ============================================================================
# Heuristic Rule Configuration
# Enable/disable specific rules and set custom severity overrides
# ============================================================================

[heuristics]
# Global toggle for all heuristic scanning
enabled = true

# Minimum confidence score for heuristic findings (1-10, 0 = show all findings)
min_confidence = 0

# Minimum severity level to include in report (CRITICAL, HIGH, MEDIUM, LOW, INFO)
min_severity = "INFO"

# Severity override: upgrade or downgrade rule severity
# Format: RULE_ID = "NEW_SEVERITY"
[heuristics.severity_overrides]
# Example: Downgrade timestamp usage from MEDIUM to LOW for time-based contracts
# BLOCK_TIMESTAMP_RANDOMNESS = "LOW"

# Rule-specific toggles: disable individual rules
[heuristics.disabled_rules]
# Format: RULE_ID = true (to disable)
# Examples:
# BLOCK_TIMESTAMP_RANDOMNESS = true  # Allow timestamp usage in this project
# HARDCODED_ADDRESS = true           # Expected for oracle contracts
# DIVIDE_BEFORE_MULTIPLY = true      # Project uses safe precision patterns


# ============================================================================
# Suppressions (Accepted Risks)
# Mark specific findings as false positives or accepted design decisions
# ============================================================================

[[suppressions]]
# Suppress by rule + file + line
rule_id = "EXAMPLE_RULE"
file = "contracts/Example.sol"
line = 42
reason = "This is a known safe pattern in this specific context"
expires = "2025-12-31"  # Optional: suppression expires on date

# [[suppressions]]
# # Suppress by rule + file (all occurrences in file)
# rule_id = "HARDCODED_ADDRESS"
# file = "contracts/Oracle.sol"
# reason = "Oracle address is intentionally hardcoded per deployment"

# [[suppressions]]
# # Suppress by rule globally
# rule_id = "EMERGENCY_WITHDRAW_PUBLIC"
# reason = "All emergency functions have onlyOwner, heuristic is false positive"


# ============================================================================
# Static Analyzer Configuration
# ============================================================================

[static_analysis]
# Slither configuration
[static_analysis.slither]
enabled = true
# Detectors to exclude (comma-separated)
exclude_detectors = ""
# Filter: only show issues with these impacts (High,Medium,Low,Informational)
include_impact = "High,Medium"

# Aderyn configuration
[static_analysis.aderyn]
enabled = false  # Opt-in only
# Scope: limit analysis to specific paths
scope = ""


# ============================================================================
# Fuzzing Configuration
# ============================================================================

[fuzzing]
# Foundry fuzzing
[fuzzing.foundry]
enabled = false
runs = 10000
max_test_rejects = 100000

# Medusa fuzzing
[fuzzing.medusa]
enabled = false
test_limit = 100000
timeout = 300  # seconds
workers = 10


# ============================================================================
# Red Team Scan Configuration
# ============================================================================

[red_team]
# Severity levels to include in findings (High, Medium, Low, Informational)
severity_allowlist = ["High", "Medium"]

# Check IDs to ignore (noise filtering)
ignore_checks = [
    "solc-version",
    "naming-convention",
    "assembly",
    "redundant-statements"
]


# ============================================================================
# External Tool Timeouts and Settings
# ============================================================================

[external_tools]
# Aderyn static analyzer timeout (seconds)
aderyn_timeout = 120

# Mythril symbolic execution timeout (seconds)
mythril_timeout = 600

# Foundry fuzzing default runs
foundry_fuzz_runs = 1000


# ============================================================================
# Supply Chain Security Configuration
# ============================================================================

[supply_chain]
# Package ecosystem to check (npm, pypi, etc.)
ecosystem = "npm"

# OSV API timeout (seconds)
osv_timeout = 10

# OSV API max retries
osv_max_retries = 3

# OSV API rate limit (requests per second)
osv_rate_limit = 10


# ============================================================================
# Threat Intelligence Configuration
# ============================================================================

[threat_intel]
# Code4rena GitHub API timeout (seconds)
c4_timeout = 10

# Immunefi RSS feed timeout (seconds)
immunefi_timeout = 10

# Solana intelligence GitHub API timeout (seconds)
solana_github_timeout = 10

# Default API rate limit (requests per second)
api_rate_limit = 5

# Set to true for air-gapped environments (skips all network calls)
offline_mode = false

# Path to bundled threat intel database (used when offline or network fails)
bundled_db_path = "data/threat_intel_db.json"


# ============================================================================
# HTTP Client Configuration
# ============================================================================

[http]
# Default timeout for HTTP requests (seconds)
default_timeout = 30

# Default max retries for failed requests
max_retries = 3

# Base delay for exponential backoff (seconds)
base_delay = 1.0

# Maximum delay cap for exponential backoff (seconds)
max_delay = 30.0

# Backoff multiplier for exponential backoff
backoff_factor = 2.0


# ============================================================================
# Chain-Specific Settings
# ============================================================================

[chains]
# Solana/Anchor static analysis
[chains.solana]
enabled = false
# Path to Solana project root (relative to config)
project_root = "./programs"

# Anchor IDL validation settings
[chains.solana.idl]
# Path to IDL files (relative to project_root)
idl_path = "target/idl"
# Validate account constraints in IDL
validate_constraints = true
# Trace Cross-Program Invocations in IDL
trace_cpi = true

# EVM-specific rules
[chains.evm]
# Expected compiler version range
solc_version = ">=0.8.0"
# Known safe external contracts (won't flag as risky external calls)
trusted_contracts = [
    "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48",  # USDC
    "0xdAC17F958D2ee523a2206206994597C13D831ec7",  # USDT
]


# ============================================================================
# Upgrade Safety Configuration
# ============================================================================

[upgrade_diff]
# Automatically run upgrade diff if these files exist
old_implementation_path = ""
new_implementation_path = ""

# Patterns to ignore in upgrade diff
[upgrade_diff.ignore_patterns]
# Ignore new view functions (read-only, low risk)
ignore_new_view_functions = true
# Ignore natspec/comment changes
ignore_comment_changes = true


# ============================================================================
# Reporting Configuration
# ============================================================================

[reporting]
# Output format (markdown, json, sarif, html, pdf)
# Notes:
#   - markdown : Always free; GitHub-friendly Markdown output
#   - json     : Always free; raw findings in JSON format
#   - sarif    : Pro feature; SARIF 2.1.0 for GitHub Code Scanning
#   - html     : Pro feature; professional branded HTML report
#   - pdf      : Pro feature; PDF export of the HTML report
#                Requires: pip install counterscarp-engine[pdf]
format = "markdown"

# Include sections in report
[reporting.sections]
executive_summary = true
supply_chain = true
static_analysis = true
heuristic_scan = true
fuzzing = false  # Opt-in for reports
threat_intel = false  # Opt-in for reports
access_matrix = true

# Report verbosity (minimal, standard, verbose)
verbosity = "standard"

# Group findings by severity or by file
group_by = "severity"  # Options: severity, file, rule


# ============================================================================
# CI/CD Integration
# ============================================================================

[ci]
# Fail pipeline if critical/high issues found
fail_on_findings = true

# Post results as PR comment (GitHub Actions)
post_pr_comment = true

# Upload SARIF to GitHub Security tab
upload_sarif = false

# Paths to exclude from scanning (glob patterns)
exclude_paths = [
    "test/**",
    "script/**",
    "node_modules/**",
    ".git/**",
    "lib/**",
]


# ============================================================================
# Exploit PoC Auto-Generation
# ============================================================================

[exploit_generation]
# Automatically generate Foundry test exploits for findings
auto_generate = false

# Minimum severity to generate exploits for (CRITICAL, HIGH, MEDIUM, LOW)
min_severity = "HIGH"

# Validate generated exploits compile with forge build
validate_compilation = true

# Output directory for generated exploit files
output_dir = "exploits/"

# LLM backend for enhancement ("none", "openai", "anthropic")
# "none" = use local templates only, no API calls
llm_backend = "none"

# Directory containing exploit templates
template_dir = "exploit_templates/"

# ============================================================================
# CI/CD Pipeline Generator
# ============================================================================

[ci.generator]
# Target platform for pipeline generation
# Options: "github", "gitlab", "azure", "jenkins"
platform = "github"

# Triggers for the pipeline
# Options: "push", "pull_request", "schedule", "workflow_dispatch"
triggers = ["push", "pull_request"]

# Notification channels
# Options: "slack", "discord"
notifications = []

# Custom steps to add to the pipeline (advanced)
custom_steps = []


# ============================================================================
# History Scanning Configuration
# ============================================================================

[history]
# Maximum commits to scan in history mode
max_commits = 50

# Branches to scan (list of branch names)
scan_branches = ["main"]

# Include fixed vulnerabilities in reports
include_fixed = true

# Output directory for history scan reports
output_dir = "."


# ============================================================================
# Attack Graph Visualization Configuration
# ============================================================================

[visualization]
# Enable attack graph visualization generation
enabled = false

# Include source code analysis in graph (parses contracts for structure)
include_source_analysis = true

# Enable attack path tracing through external calls
trace_attack_paths = true

# Output format for visualization ("html", "json", or "both")
output_format = "html"

# Maximum depth for attack path tracing (0 = unlimited)
max_path_depth = 10


# ============================================================================
# Protocol Fingerprint Scanner Configuration
# ============================================================================

[fingerprint]
# Enable protocol fingerprint similarity scanning
enabled = false

# Minimum similarity threshold (0.0-1.0) for protocol matching
min_similarity = 0.7

# Path to fingerprint database JSON file
database_path = "data/protocol_fingerprints.json"

# Include risk assessment in scan results
include_risk_assessment = true


# ============================================================================
# AI and RAG Configuration
# ============================================================================

[ai]
# Embedding backend for RAG (local, openai, anthropic)
# "local" uses sentence-transformers (default, no API needed)
embedding_backend = "local"

# LLM provider: "none" (disabled), "openai", "ollama"
llm_backend = "none"

# Model name — used for both OpenAI and Ollama
# OpenAI examples: "gpt-4o-mini", "gpt-4-turbo-preview"
# Ollama examples: "deepseek-coder", "codellama", "llama3"
llm_model = "gpt-4o-mini"

# Ollama endpoint (only used when llm_backend = "ollama")
ollama_url = "http://localhost:11434"

# OpenAI model (deprecated — use llm_model instead; kept for backward compat)
openai_model = "gpt-4-turbo-preview"

# Path to the RAG vector index
rag_index_path = ".counterscarp/rag_index.json"

# Number of similar findings to retrieve for enrichment
top_k = 5

# Automatically enrich findings with RAG context
auto_enrich = false

# Enable LLM-powered analysis for enriched findings
# Requires llm_backend != "none".  For OpenAI also set OPENAI_API_KEY env var.
llm_enrichment = false


# ============================================================================
# Plugin Configuration
# ============================================================================

[plugins]
# Enable plugin system for community-contributed analyzers
enabled = true

# Directories to scan for plugin modules (relative to project root)
dirs = [".counterscarp/plugins"]


# ============================================================================
# License Configuration
# ============================================================================

[license]
# Pro license key. Can also be set via COUNTERSCARP_PRO_LICENSE env var.
# Get your key at https://counterscarp.io/pricing
key = ""


