# ==============================================================================
# COUNTERSCARP ENGINE — DOCKER COMPOSE
# Bundles the complete 21-analyzer stack for EVM smart contract auditing.
# ==============================================================================
#
# Quick start:
#   docker-compose build
#   docker-compose run --rm counterscarp --target /scan --report --output-dir /output
#
# Environment variables (create a .env file or export before running):
#   COUNTERSCARP_PRO_LICENSE   — Pro license key (leave empty for community tier)
#
# Volume mounts:
#   ./target  → /scan    — place your Solidity project here before running
#   ./output  → /output  — audit reports and exploit PoCs are written here
# ==============================================================================

services:

  # ── Primary scan service ─────────────────────────────────────────────────────
  counterscarp:
    build:
      context: .
      dockerfile: Dockerfile

    # Tag the locally-built image for easy reference
    image: counterscarp-engine:5.0.5

    # ── Volume mounts ───────────────────────────────────────────────────────────
    volumes:
      # Mount the contract source tree as the scan target
      - ./target:/scan
      # Mount a host directory to receive reports and PoC exploits
      - ./output:/output
      # Persist Foundry compilation cache across runs
      - foundry-cache:/home/counterscarp/.foundry/cache

    # ── Environment ────────────────────────────────────────────────────────────
    environment:
      # Pro license key — pass via .env or export COUNTERSCARP_PRO_LICENSE=<key>
      - COUNTERSCARP_PRO_LICENSE=${COUNTERSCARP_PRO_LICENSE:-}
      # Prevent Python from buffering stdout (so logs stream live)
      - PYTHONUNBUFFERED=1

    # ── Default command ─────────────────────────────────────────────────────────
    # Runs a full audit scan on /scan and writes reports to /output.
    # Override at runtime with `docker-compose run --rm counterscarp <args>`.
    command: ["--target", "/scan", "--report", "--output-dir", "/output"]

    # ── Healthcheck ─────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "counterscarp", "--doctor"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 15s

    # ── Resource limits (adjust to your host capacity) ──────────────────────────
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  # ── Doctor / diagnostics service ─────────────────────────────────────────────
  # Verifies all 21 analyzer tools are reachable inside the container.
  # Usage: docker-compose run --rm doctor
  doctor:
    build:
      context: .
      dockerfile: Dockerfile
    image: counterscarp-engine:5.0.5
    command: ["--doctor"]

  # ── Heuristic-only scan (no external tool dependencies) ──────────────────────
  # Usage: docker-compose run --rm heuristic --target /scan
  heuristic:
    build:
      context: .
      dockerfile: Dockerfile
    image: counterscarp-engine:5.0.5
    volumes:
      - ./target:/scan
      - ./output:/output
    command: ["--target", "/scan"]

  # ── Symbolic execution via Mythril ───────────────────────────────────────────
  # Usage: docker-compose run --rm symbolic --target /scan
  symbolic:
    build:
      context: .
      dockerfile: Dockerfile
    image: counterscarp-engine:5.0.5
    volumes:
      - ./target:/scan
      - ./output:/output
    command: ["--target", "/scan", "--symbolic"]

# ==============================================================================
# NAMED VOLUMES
# ==============================================================================
# foundry-cache persists downloaded forge dependencies across container runs,
# significantly speeding up repeated fuzzing sessions.
volumes:
  foundry-cache:
    driver: local

# ==============================================================================
# USAGE EXAMPLES
# ==============================================================================
#
# 1. Build the image:
#      docker-compose build
#
# 2. Full audit (reads ./target, writes to ./output):
#      docker-compose run --rm counterscarp
#
# 3. Full audit with Pro license:
#      COUNTERSCARP_PRO_LICENSE=<key> docker-compose run --rm counterscarp
#
# 4. Run environment diagnostics:
#      docker-compose run --rm doctor
#
# 5. Heuristic-only fast scan:
#      docker-compose run --rm heuristic --target /scan
#
# 6. Symbolic execution only:
#      docker-compose run --rm symbolic --target /scan
#
# 7. Interactive shell for debugging:
#      docker-compose run --rm --entrypoint /bin/bash counterscarp
# ==============================================================================
