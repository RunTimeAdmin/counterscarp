version: '3.8'

services:
  # =============================================================================
  # THE GARRISON ENGINE - DOCKER COMPOSE CONFIGURATION
  # =============================================================================
  
  audit:
    build: .
    image: tokenaudit/garrison-engine:latest
    container_name: garrison-engine
    
    volumes:
      # Mount current directory to /scan inside container
      # This allows the engine to analyze your contracts
      - .:/scan
      
      # Optional: Persist Foundry cache (speeds up repeated fuzzing)
      - foundry-cache:/root/.foundry
    
    # Default command: Run full orchestrator pipeline
    command: ["--target", "/scan"]
    
    # Environment overrides (optional)
    environment:
      # Set custom Solidity version if needed
      - SOLC_VERSION=0.8.19
      
      # Enable verbose logging
      - DEBUG=1
    
    # Resource limits (prevents container from consuming all system resources)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G

    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # STANDALONE MODULES (Run specific tools without full pipeline)
  # =============================================================================
  
  # Heuristic Scanner Only
  heuristic-scan:
    build: .
    image: tokenaudit/garrison-engine:latest
    container_name: garrison-heuristic
    volumes:
      - .:/scan
    command: ["python3", "heuristic_scanner.py", "/scan"]
  
  # Threat Intelligence (Auto-detects EVM vs Solana)
  threat-intel:
    build: .
    image: tokenaudit/garrison-engine:latest
    container_name: garrison-intel
    volumes:
      - .:/scan
    entrypoint: ["python3", "threat_intel.py"]
    command: ["/scan/contracts/YourContract.sol"]
  
  # Liar Detector (Intent Checker)
  liar-detector:
    build: .
    image: tokenaudit/garrison-engine:latest
    container_name: garrison-intent
    volumes:
      - .:/scan
    entrypoint: ["python3", "intent_check.py"]
    command: ["/scan/contracts/YourContract.sol"]
  
  # Access Matrix (God Mode Detector)
  access-matrix:
    build: .
    image: tokenaudit/garrison-engine:latest
    container_name: garrison-access
    volumes:
      - .:/scan
    entrypoint: ["python3", "access_matrix.py"]
    command: ["/scan/contracts/YourContract.sol"]

volumes:
  foundry-cache:
    driver: local

# =============================================================================
# USAGE EXAMPLES:
# =============================================================================
#
# 1. Build the engine:
#    docker-compose build
#
# 2. Run full audit pipeline:
#    docker-compose run --rm audit --target /scan
#
# 3. Run specific module (e.g., Liar Detector):
#    docker-compose run --rm liar-detector /scan/contracts/Vault.sol
#
# 4. Run threat intelligence:
#    docker-compose run --rm threat-intel /scan/contracts/Token.sol
#
# 5. Interactive shell (for debugging):
#    docker-compose run --rm audit /bin/bash
#
# 6. Run heuristic scan only:
#    docker-compose run --rm heuristic-scan
#
# =============================================================================
