[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-engine"
version = "3.1.2"
description = "Smart contract security auditing platform with Pro features"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sentinel Engine Team"}]
readme = "README.md"
keywords = ["security", "audit", "smart-contracts", "solidity", "solana", "blockchain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    # Core dependencies (required)
    "requests>=2.31.0",
    "packaging>=23.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "solc-select>=1.0.4",
]

[project.urls]
Homepage = "https://sentinel-engine.io"
Repository = "https://github.com/RunTimeAdmin/sentinel-engine"
Documentation = "https://github.com/RunTimeAdmin/sentinel-engine/tree/main/docs"
"Bug Tracker" = "https://github.com/RunTimeAdmin/sentinel-engine/issues"

[project.optional-dependencies]
ai = [
    # AI/RAG dependencies (optional - module works without them)
    "sentence-transformers>=2.0",
    "numpy>=1.24",
]
advanced = [
    # Optional advanced tools
    "openai>=1.0",
]
web = [
    # Web UI dependencies
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "aiofiles>=23.0",
    "stripe>=5.0.0",
]
dev = [
    # Development/testing dependencies
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "pytest-benchmark>=4.0",
]

[project.scripts]
sentinel-engine = "orchestrator:main"
sentinel = "orchestrator:main"
sentinel-generate-pipeline = "pipeline_generator:main"

[tool.pytest.ini_options]
# Migrated from pytest.ini - this file can now be removed
# Original pytest.ini location: pytest.ini
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.setuptools]
include-package-data = true
packages = ["webapp", "webapp.templates", "webapp.static"]
py-modules = [
    "orchestrator",
    "config_loader",
    "logger",
    "exceptions",
    "http_utils",
    "heuristic_scanner",
    "red_team_scan",
    "aderyn_wrapper",
    "medusa_wrapper",
    "symbolic_wrapper",
    "fuzz_wrapper",
    "supply_chain_check",
    "access_matrix",
    "intent_check",
    "upgrade_diff",
    "solana_analyzer",
    "knowledge_fetcher",
    "solana_intel",
    "threat_intel",
    "inflation_scaffold",
    "report_generator",
    "exploit_generator",
    "gui",
    "embeddings",
    "rag_engine",
    "attack_graph",
    "visualizer",
    "history_scanner",
    "idl_validator",
    "pipeline_generator",
    "fingerprint_scanner",
    "protocol_db",
    "plugin_manager",
    "license_manager",
]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.txt", "*.md", "py.typed", "*.pyi"]
webapp = ["templates/*.html", "static/*.css", "static/*.png"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
