<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack Path Analysis - Test Project</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 1.5em;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }
        
        .sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
        }
        
        .graph-area {
            flex: 1;
            position: relative;
        }
        
        #graph-container {
            width: 100%;
            height: 100%;
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .panel h3 {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #4ecdc4;
        }
        
        .filter-group {
            margin-bottom: 15px;
        }
        
        .filter-group label {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        .filter-group input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
        }
        
        .color-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }
        
        .search-box {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #4ecdc4;
        }
        
        .stat-label {
            font-size: 0.75em;
            color: #888;
            text-transform: uppercase;
        }
        
        .node-label {
            font-size: 11px;
            fill: #ffffff;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        .tooltip {
            position: absolute;
            text-align: center;
            padding: 8px 12px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            border-radius: 4px;
            pointer-events: none;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .details-panel {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .details-panel.active {
            display: block;
        }
        
        .details-panel h4 {
            color: #4ecdc4;
            margin-bottom: 10px;
            font-size: 1em;
        }
        
        .details-row {
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        
        .details-label {
            color: #888;
            display: inline-block;
            width: 80px;
        }
        
        .severity-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .severity-critical { background: #8B0000; }
        .severity-high { background: #E74C3C; }
        .severity-medium { background: #F39C12; }
        .severity-low { background: #3498DB; }
        .severity-info { background: #95A5A6; }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85em;
        }
        
        .legend-line {
            width: 30px;
            height: 2px;
            margin-right: 8px;
        }
        
        button {
            background: #4ecdc4;
            color: #1a1a2e;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }
        
        button:hover {
            background: #45b7b8;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }
        
        .control-btn:hover {
            background: rgba(78, 205, 196, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Attack Path Analysis - Test Project</h1>
        <div style="color: #888; font-size: 0.9em;">
            Counterscarp Engine Attack Path Visualizer
        </div>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <div class="panel">
                <h3>Statistics</h3>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value">2</div>
                        <div class="stat-label">Vulns</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Contracts</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Functions</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Edges</div>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h3>Search</h3>
                <input type="text" class="search-box" id="searchInput" 
                       placeholder="Search nodes..." onkeyup="searchNodes()">
            </div>
            
            <div class="panel">
                <h3>Node Filters</h3>
                <div class="filter-group">
                    <label>
                        <input type="checkbox" checked onchange="toggleNodeType('Contract')">
                        <span class="color-indicator" style="background: #4A90E2"></span>
                        Contracts
                    </label>
                    <label>
                        <input type="checkbox" checked onchange="toggleNodeType('Function')">
                        <span class="color-indicator" style="background: #50C878"></span>
                        Functions
                    </label>
                    <label>
                        <input type="checkbox" checked onchange="toggleNodeType('Vulnerability')">
                        <span class="color-indicator" style="background: #E74C3C"></span>
                        Vulnerabilities
                    </label>
                    <label>
                        <input type="checkbox" checked onchange="toggleNodeType('ExternalCall')">
                        <span class="color-indicator" style="background: #F39C12"></span>
                        External Calls
                    </label>
                </div>
            </div>
            
            <div class="panel">
                <h3>Severity Filter</h3>
                <div class="filter-group">
                    <label>
                        <input type="checkbox" checked onchange="toggleSeverity('CRITICAL')">
                        <span class="color-indicator" style="background: #8B0000"></span>
                        Critical
                    </label>
                    <label>
                        <input type="checkbox" checked onchange="toggleSeverity('HIGH')">
                        <span class="color-indicator" style="background: #E74C3C"></span>
                        High
                    </label>
                    <label>
                        <input type="checkbox" checked onchange="toggleSeverity('MEDIUM')">
                        <span class="color-indicator" style="background: #F39C12"></span>
                        Medium
                    </label>
                    <label>
                        <input type="checkbox" checked onchange="toggleSeverity('LOW')">
                        <span class="color-indicator" style="background: #3498DB"></span>
                        Low
                    </label>
                </div>
            </div>
            
            <div class="panel">
                <h3>Edge Legend</h3>
                <div class="legend-item">
                    <div class="legend-line" style="background: #fff;"></div>
                    <span>Calls</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #aaa; border-top: 2px dashed #aaa; height: 0;"></div>
                    <span>Reads</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #ff6b6b; border-top: 2px dotted #ff6b6b; height: 0;"></div>
                    <span>Writes</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #ff9f43; height: 3px;"></div>
                    <span>Delegates</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #4ecdc4; border-top: 2px double #4ecdc4; height: 0;"></div>
                    <span>Inherits</span>
                </div>
            </div>
            
            <div class="details-panel" id="detailsPanel">
                <h4>Node Details</h4>
                <div id="detailsContent"></div>
            </div>
        </div>
        
        <div class="graph-area">
            <div id="graph-container"></div>
            <div class="controls">
                <button class="control-btn" onclick="zoomIn()" title="Zoom In">+</button>
                <button class="control-btn" onclick="zoomOut()" title="Zoom Out">−</button>
                <button class="control-btn" onclick="resetZoom()" title="Reset">⟲</button>
            </div>
        </div>
    </div>
    
    <script>
        
        // Graph data
        const graphData = {"nodes": [{"id": "Vulnerability_UNCHECKED_EXTERNAL_CALL_0962_L42", "type": "Vulnerability", "name": "UNCHECKED_EXTERNAL_CALL", "severity": "CRITICAL", "file": "contracts/Vault.sol", "line": 42, "description": "Low-level call without return value check. Funds may be lost if call fails silently.", "rule_id": "UNCHECKED_EXTERNAL_CALL", "size": 20}, {"id": "Vulnerability_INTENT_IMPLEMENTATION_MISMATCH_7386_L100", "type": "Vulnerability", "name": "INTENT_IMPLEMENTATION_MISMATCH", "severity": "CRITICAL", "file": "contracts/Token.sol", "line": 100, "description": "Comment says 'only owner' but function is public with no modifiers.", "rule_id": "INTENT_IMPLEMENTATION_MISMATCH", "size": 20}], "links": [], "metadata": {"node_count": 2, "edge_count": 0, "node_types": ["Vulnerability"], "edge_types": []}};
        
        // Node colors
        const nodeColors = {"Contract": "#4A90E2", "Function": "#50C878", "Vulnerability": "#E74C3C", "ExternalCall": "#F39C12", "StateVariable": "#95A5A6"};
        const severityColors = {"CRITICAL": "#8B0000", "HIGH": "#E74C3C", "MEDIUM": "#F39C12", "LOW": "#3498DB", "INFO": "#95A5A6"};
        const edgeStyles = {"calls": {"stroke": "#ffffff", "strokeWidth": 1.5, "dash": "none"}, "reads": {"stroke": "#aaaaaa", "strokeWidth": 1, "dash": "5,5"}, "writes": {"stroke": "#ff6b6b", "strokeWidth": 1.5, "dash": "2,2"}, "delegates": {"stroke": "#ff9f43", "strokeWidth": 3, "dash": "none"}, "inherits": {"stroke": "#4ecdc4", "strokeWidth": 2, "dash": "10,5"}, "contains": {"stroke": "#666666", "strokeWidth": 1, "dash": "none"}, "triggers": {"stroke": "#e74c3c", "strokeWidth": 2, "dash": "none"}};
        
        // Get container dimensions
        const container = document.getElementById('graph-container');
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        // Create SVG
        const svg = d3.select('#graph-container')
            .append('svg')
            .attr('width', width)
            .attr('height', height)
            .attr('viewBox', [0, 0, width, height]);
        
        // Add zoom behavior
        const g = svg.append('g');
        
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });
        
        svg.call(zoom);
        
        // Create force simulation
        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.links)
                .id(d => d.id)
                .distance(100))
            .force('charge', d3.forceManyBody().strength(-300))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(d => (d.size || 10) + 10));
        
        // Create arrow markers
        const defs = svg.append('defs');
        
        Object.keys(edgeStyles).forEach(type => {
            defs.append('marker')
                .attr('id', `arrow-${type}`)
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 25)
                .attr('refY', 0)
                .attr('markerWidth', 6)
                .attr('markerHeight', 6)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .attr('fill', edgeStyles[type].stroke);
        });
        
        // Create links
        const link = g.append('g')
            .attr('class', 'links')
            .selectAll('line')
            .data(graphData.links)
            .enter()
            .append('line')
            .attr('stroke', d => edgeStyles[d.type]?.stroke || '#999')
            .attr('stroke-width', d => edgeStyles[d.type]?.strokeWidth || 1)
            .attr('stroke-dasharray', d => edgeStyles[d.type]?.dash || 'none')
            .attr('marker-end', d => `url(#arrow-${d.type})`);
        
        // Create nodes
        const node = g.append('g')
            .attr('class', 'nodes')
            .selectAll('g')
            .data(graphData.nodes)
            .enter()
            .append('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));
        
        // Add circles to nodes
        node.append('circle')
            .attr('r', d => d.size || 10)
            .attr('fill', d => {
                if (d.type === 'Vulnerability') {
                    return severityColors[d.severity] || nodeColors[d.type];
                }
                return nodeColors[d.type] || '#999';
            })
            .attr('stroke', '#fff')
            .attr('stroke-width', 2);
        
        // Add labels to nodes
        node.append('text')
            .attr('dy', d => (d.size || 10) + 15)
            .attr('text-anchor', 'middle')
            .text(d => d.name)
            .attr('class', 'node-label');
        
        // Tooltip
        const tooltip = d3.select('body').append('div')
            .attr('class', 'tooltip')
            .style('opacity', 0);
        
        // Node hover events
        node.on('mouseover', function(event, d) {
            tooltip.transition()
                .duration(200)
                .style('opacity', .9);
            tooltip.html(`<strong>${d.name}</strong><br/>Type: ${d.type}`)
                .style('left', (event.pageX + 10) + 'px')
                .style('top', (event.pageY - 28) + 'px');
        })
        .on('mouseout', function(d) {
            tooltip.transition()
                .duration(500)
                .style('opacity', 0);
        });
        
        // Node click event
        node.on('click', function(event, d) {
            showNodeDetails(d);
        });
        
        // Update positions on tick
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);
            
            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });
        
        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // Store references for filtering
        window.graphNodes = node;
        window.graphLinks = link;
        window.graphData = graphData;
    
        
        // Filter state
        const activeNodeTypes = new Set(['Contract', 'Function', 'Vulnerability', 'ExternalCall', 'StateVariable']);
        const activeSeverities = new Set(['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'INFO']);
        
        // Toggle node type visibility
        function toggleNodeType(nodeType) {
            if (activeNodeTypes.has(nodeType)) {
                activeNodeTypes.delete(nodeType);
            } else {
                activeNodeTypes.add(nodeType);
            }
            updateVisibility();
        }
        
        // Toggle severity visibility
        function toggleSeverity(severity) {
            if (activeSeverities.has(severity)) {
                activeSeverities.delete(severity);
            } else {
                activeSeverities.add(severity);
            }
            updateVisibility();
        }
        
        // Update node visibility based on filters
        function updateVisibility() {
            window.graphNodes.style('opacity', d => {
                if (!activeNodeTypes.has(d.type)) return 0.1;
                if (d.type === 'Vulnerability' && !activeSeverities.has(d.severity)) return 0.1;
                return 1;
            });
            
            window.graphLinks.style('opacity', d => {
                const sourceVisible = activeNodeTypes.has(d.source.type);
                const targetVisible = activeNodeTypes.has(d.target.type);
                return (sourceVisible && targetVisible) ? 1 : 0.1;
            });
        }
        
        // Search functionality
        function searchNodes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            window.graphNodes.style('opacity', d => {
                if (!query) return 1;
                const match = d.name.toLowerCase().includes(query) ||
                             d.type.toLowerCase().includes(query);
                return match ? 1 : 0.1;
            });
            
            window.graphLinks.style('opacity', 0.1);
        }
        
        // Show node details
        function showNodeDetails(node) {
            const panel = document.getElementById('detailsPanel');
            const content = document.getElementById('detailsContent');
            
            let html = `
                <div class="details-row">
                    <span class="details-label">Name:</span>
                    <span>${node.name}</span>
                </div>
                <div class="details-row">
                    <span class="details-label">Type:</span>
                    <span>${node.type}</span>
                </div>
            `;
            
            if (node.type === 'Vulnerability') {
                html += `
                    <div class="details-row">
                        <span class="details-label">Severity:</span>
                        <span class="severity-badge severity-${node.severity.toLowerCase()}">${node.severity}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Rule:</span>
                        <span>${node.rule_id || 'N/A'}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">File:</span>
                        <span>${node.file || 'N/A'}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Line:</span>
                        <span>${node.line || 'N/A'}</span>
                    </div>
                    <div class="details-row" style="margin-top: 10px;">
                        <span class="details-label">Description:</span>
                        <p style="margin-top: 5px; color: #aaa;">${node.description || 'No description available'}</p>
                    </div>
                `;
            } else if (node.file) {
                html += `
                    <div class="details-row">
                        <span class="details-label">File:</span>
                        <span>${node.file}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Line:</span>
                        <span>${node.line || 'N/A'}</span>
                    </div>
                `;
            }
            
            if (node.visibility) {
                html += `
                    <div class="details-row">
                        <span class="details-label">Visibility:</span>
                        <span>${node.visibility}</span>
                    </div>
                `;
            }
            
            content.innerHTML = html;
            panel.classList.add('active');
        }
        
        // Zoom controls
        function zoomIn() {
            d3.select('#graph-container svg').transition().call(
                d3.zoom().transform,
                d3.zoomTransform(d3.select('#graph-container svg').node()).scale(1.3)
            );
        }
        
        function zoomOut() {
            d3.select('#graph-container svg').transition().call(
                d3.zoom().transform,
                d3.zoomTransform(d3.select('#graph-container svg').node()).scale(0.7)
            );
        }
        
        function resetZoom() {
            d3.select('#graph-container svg').transition().call(
                d3.zoom().transform,
                d3.zoomIdentity
            );
        }
    </script>
</body>
</html>
